map $http_upgrade $is_ws { default 0; websocket 1; }

server {
    # Hanya lokal. Port publik 80/8080/443 dipegang HAProxy.
    listen 127.0.0.1:8880 default_server;
    server_name _;
    default_type text/html;

    location = /vless  { include /etc/xray-script/ws.conf; proxy_pass http://127.0.0.1:10001; }
    location = /vmess  { include /etc/xray-script/ws.conf; proxy_pass http://127.0.0.1:10002; }
    location = /trojan { include /etc/xray-script/ws.conf; proxy_pass http://127.0.0.1:10003; }

    # SSH WS: /ssh-ws atau request WebSocket apa saja ke /
    location / {
        if ($is_ws = 0) { return 200 '<!DOCTYPE html><html><head><title>Welcome</title></head><body><h1>It works!</h1></body></html>'; }
        include /etc/xray-script/ws.conf;
        proxy_pass http://127.0.0.1:10015;
    }
}
